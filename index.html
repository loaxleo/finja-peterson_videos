<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4D43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Finja">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<title>Videosammlung</title>
<style>
  :root {
    --bg: #1F4D43;
    --mint: #CFF5E7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  h1, .widmung {
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    color: var(--mint);
    max-width: 700px;
    margin: 0 auto;
  }
  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.15;
    padding: 12px 2px 20px;
  }
  .widmung {
    font-size: 19px;
    font-weight: 500;
    text-align: center;
    padding-top: 40px;
    opacity: .85;
  }
  #v {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  video {
    display: block;
    width: 100%;
    max-width: 700px;
    margin: 0 auto;
    border-radius: 14px;
    background: #173a32;
    object-fit: cover;
  }
  .rand {
    display: block;
    width: 44px; height: 44px;
    margin: 20px auto 0;
    border-radius: 50%;
    background: var(--mint);
    color: #1F4D43;
    font: 300 28px/44px system-ui, sans-serif;
    text-align: center;
    text-decoration: none;
    opacity: .6;
  }
  /* Video auf der Seite + Vollbild-Knopf */
  .kachel { position: relative; max-width: 700px; margin: 0 auto; width: 100%; }
  .gross {
    position: absolute; top: 10px; right: 10px;
    width: 38px; height: 38px; border: 0; border-radius: 50%;
    background: rgba(0, 0, 0, .45); color: var(--mint);
    display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .gross svg { width: 18px; height: 18px; }

  /* Vollbild: wischen hoch/runter */
  #vollbild { position: fixed; inset: 0; z-index: 10; background: #000; }
  #vollbild[hidden] { display: none; }
  #spur {
    height: 100%; overflow-y: scroll;
    scroll-snap-type: y mandatory; overscroll-behavior: contain;
    scrollbar-width: none;
  }
  #spur::-webkit-scrollbar { display: none; }
  .folie {
    position: relative; height: 100%;
    scroll-snap-align: start; scroll-snap-stop: always;
  }
  .folie img, .folie video {
    position: absolute; left: 0; width: 100%;
    top: env(safe-area-inset-top);
    height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    object-fit: contain; border-radius: 0; max-width: none; background: #000;
  }
  #zu {
    position: fixed; z-index: 11;
    top: calc(env(safe-area-inset-top) + 10px); left: 12px;
    width: 40px; height: 40px; border: 0; border-radius: 50%;
    background: rgba(0, 0, 0, .45); color: var(--mint);
    display: flex; align-items: center; justify-content: center;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #zu svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<h1>Für Finja – zum 18. | Videosammlung</h1>
<main id="v"></main>
<p class="widmung">Videos sortieren, hinzufügen o. löschen.</p>
<a class="rand" href="upload.html" aria-label="Videos verwalten">+</a>

<div id="vollbild" hidden>
  <div id="spur"></div>
  <button id="zu" aria-label="Schliessen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>

<script>
  const box = document.getElementById('v');

  // Pausieren, sobald ein Video kaum noch sichtbar ist
  const beobachter = new IntersectionObserver(eintraege => {
    eintraege.forEach(e => { if (e.intersectionRatio < 0.3 && !e.target.paused) e.target.pause(); });
  }, { threshold: [0, 0.3] });

  const SYMBOL_GROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>';
  let liste = [];

  // Liste (Reihenfolge) wird automatisch von GitHub gepflegt: videos.json
  fetch('videos.json', { cache: 'no-store' })
    .then(r => r.json())
    .then(namen => {
      liste = namen;
      liste.forEach((name, i) => {
        const id = name.replace('.mp4', '');
        const k = document.createElement('div');
        k.className = 'kachel';
        const v = document.createElement('video');
        v.src = `videos/${name}`;
        v.poster = `posters/${id}.jpg`;   // Vorschaubild – lädt schnell
        v.controls = true;
        v.playsInline = true;             // nicht automatisch Vollbild auf iPhone
        v.preload = 'none';               // Video lädt erst beim Abspielen
        v.setAttribute('controlslist', 'nofullscreen');   // Android: eigener Vollbild-Knopf statt des normalen
        const bild = new Image();         // Seitenverhältnis schon vor dem Abspielen (aus dem Vorschaubild)
        bild.onload = () => v.style.aspectRatio = `${bild.naturalWidth} / ${bild.naturalHeight}`;
        bild.src = v.poster;
        // iPhone: normales Vollbild abfangen und stattdessen das Wisch-Vollbild öffnen
        v.addEventListener('webkitbeginfullscreen', () => {
          const t = v.currentTime;
          setTimeout(() => { v.webkitExitFullscreen(); oeffnen(i, t); }, 0);
        });
        const knopf = document.createElement('button');
        knopf.className = 'gross';
        knopf.setAttribute('aria-label', 'Vollbild');
        knopf.innerHTML = SYMBOL_GROSS;
        knopf.onclick = () => oeffnen(i, v.currentTime);
        k.append(v, knopf);
        box.appendChild(k);
        beobachter.observe(v);
      });
    });

  // ---------- Vollbild mit Wischen ----------
  const vb = document.getElementById('vollbild');
  const spur = document.getElementById('spur');
  const vv = document.createElement('video');   // EIN Player, der von Folie zu Folie wandert (iPhone erlaubt dann Abspielen beim Wischen)
  vv.controls = true;
  vv.playsInline = true;
  vv.setAttribute('controlslist', 'nofullscreen');
  vv.addEventListener('webkitbeginfullscreen', () => setTimeout(() => vv.webkitExitFullscreen(), 0));
  let aktiv = -1;

  const folienBeob = new IntersectionObserver(eintraege => {
    eintraege.forEach(e => { if (e.isIntersecting) zeige(+e.target.dataset.i); });
  }, { root: spur, threshold: 0.6 });

  function zeige(i, zeit = 0) {
    if (i === aktiv || !liste[i]) return;
    aktiv = i;
    const id = liste[i].replace('.mp4', '');
    vv.pause();
    vv.poster = `posters/${id}.jpg`;
    vv.src = `videos/${liste[i]}`;
    if (zeit) vv.addEventListener('loadedmetadata', () => vv.currentTime = zeit, { once: true });
    spur.children[i].appendChild(vv);
    vv.play().catch(() => {});
  }

  function oeffnen(i, zeit) {
    document.querySelectorAll('#v video').forEach(v => v.pause());
    if (!spur.children.length) {
      liste.forEach((name, j) => {
        const f = document.createElement('div');
        f.className = 'folie';
        f.dataset.i = j;
        const img = document.createElement('img');
        img.src = `posters/${name.replace('.mp4', '')}.jpg`;
        img.alt = '';
        f.appendChild(img);
        spur.appendChild(f);
        folienBeob.observe(f);
      });
    }
    vb.hidden = false;
    document.body.style.overflow = 'hidden';
    spur.scrollTop = i * spur.clientHeight;
    aktiv = -1;
    zeige(i, zeit);
    if (vb.requestFullscreen) vb.requestFullscreen().catch(() => {});   // Android: auch Browserleisten ausblenden
    history.pushState({ vollbild: true }, '');
  }

  function schliessen() {
    if (vb.hidden) return;
    vv.pause();
    vb.hidden = true;
    document.body.style.overflow = '';
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    const k = box.children[aktiv];
    if (k) k.scrollIntoView({ block: 'center' });   // auf der Seite beim zuletzt gesehenen Video landen
  }

  document.getElementById('zu').onclick = () => history.state && history.state.vollbild ? history.back() : schliessen();
  window.addEventListener('popstate', schliessen);   // Android-Zurück schliesst das Vollbild
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && !vb.hidden) history.state && history.state.vollbild ? history.back() : schliessen();
  });

  // Nur ein Video gleichzeitig
  document.addEventListener('play', e => {
    document.querySelectorAll('video').forEach(v => {
      if (v !== e.target) v.pause();
    });
  }, true);
</script>

</body>
</html>
